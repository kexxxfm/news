# Поклади цей файл у репозиторій за шляхом: .github/workflows/hourly.yml
name: news-every-2h

on:
  schedule:
    - cron: "5 * * * *"   # запуск щогодини (UTC); справжня робота лише перед годиною ефіру, див. check
  workflow_dispatch:       # кнопка ручного запуску (публікує одразу, без очікування)

permissions:
  contents: write

concurrency:
  group: hourly-news
  cancel-in-progress: false

env:
  AIR_EVERY: "2"        # ефір раз на N годин: 2 → 12 випусків на добу, 3 → 8, 4 → 6, 6 → 4
  AIR_OFFSET: "0"       # ефір о годинах за Києвом, для яких (година % AIR_EVERY) == AIR_OFFSET
  PUBLISH_MINUTE: "30"  # о котрій хвилині перед ефіром випуск з'являється в RSS (13:30 для ефіру о 14:00)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - id: slot
        run: |
          H=$((10#$(TZ=Europe/Kyiv date +%H)))
          NEXT=$(( (H + 1) % 24 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( NEXT % AIR_EVERY )) -eq "$AIR_OFFSET" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Київ зараз ${H} год, найближчий ефір о ${NEXT}:00"

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # запас на довгі повтори запитів до Gemini
    steps:
      - uses: actions/checkout@v4

      # Підтягуємо попередній стан сайту (гілка gh-pages). Перший раз її ще немає.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - run: |
          mkdir -p site
          rm -rf site/.git
          cp cover.jpg site/cover.jpg
          mkdir -p site/panel
          cp panel.html site/panel/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - id: bot
        run: python bot.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE || 'Години новин' }}
          WINDOW_MIN: ${{ vars.WINDOW_MIN || '120' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite,gemini-3.6-flash' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'gemini' }}
          TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}
          TTS_SPEED: ${{ vars.TTS_SPEED || '1.08' }}
          TTS_SPEED_F: ${{ vars.TTS_SPEED_F || '1.0' }}

      # Випуск готовий заздалегідь; чекаємо потрібної хвилини перед ефіром (лише для запусків за розкладом)
      - name: Дочекатися часу публікації
        if: steps.bot.outputs.published == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          M=$((10#$(TZ=Europe/Kyiv date +%M)))
          S=$((10#$(date +%S)))
          if [ "$M" -lt "$PUBLISH_MINUTE" ]; then
            sleep $(( (PUBLISH_MINUTE - M) * 60 - S ))
          fi

      # force_orphan: історія гілки не росте, лишається один останній коміт
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.bot.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      # Перевірка після публікації: чи справді відкривається mp3 (GitHub Pages оновлюється з затримкою).
      - name: Перевірити, що аудіо відкривається
        if: steps.bot.outputs.published == 'true' && steps.bot.outputs.audio_file != ''
        run: |
          URL="${{ vars.SITE_BASE_URL }}/${{ steps.bot.outputs.audio_file }}"
          code=000
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL" || true)
            if [ "$code" = "200" ]; then echo "Аудіо доступне: $URL"; exit 0; fi
            echo "Спроба $i: код $code, чекаю 30 с"; sleep 30
          done
          echo "::error::Аудіо НЕ відкривається за адресою $URL (код $code). Перевірте змінну SITE_BASE_URL і налаштування GitHub Pages."
          exit 1
